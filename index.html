<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TypeRush — Typing Speed Test</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #262b36;
    --text: #e6e9ef;
    --muted: #8a93a6;
    --accent: #5b8cff;
    --ok: #3ecf8e;
    --err: #ff5d5d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 720px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  h1 span { color: var(--accent); }
  .restart-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .restart-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(91, 140, 255, 0.08);
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .stat .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .stat .value {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat .value.accent { color: var(--accent); }
  .stat .value.ok { color: var(--ok); }
  .text-viewport {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 20px 0;
    overflow: hidden;
    margin-bottom: 16px;
    position: relative;
  }
  .text-track {
    display: inline-block;
    white-space: nowrap;
    padding: 0 40px;
    font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
    font-size: 18px;
    line-height: 1.9;
    letter-spacing: 0.5px;
    user-select: none;
    transition: transform 0.15s ease-out;
    will-change: transform;
  }
  .text-track .char {
    color: var(--muted);
    transition: color 0.05s linear;
  }
  .text-track .char.correct { color: var(--ok); }
  .text-track .char.incorrect { color: var(--err); background: rgba(255, 93, 93, 0.12); border-radius: 2px; }
  .text-track .char.current {
    color: var(--text);
    border-bottom: 2px solid var(--accent);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    50% { border-bottom-color: transparent; }
  }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .hidden { display: none !important; }
  .results {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 28px;
    text-align: center;
  }
  .results h2 {
    font-size: 18px;
    margin-bottom: 18px;
    color: var(--text);
  }
  .results .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }
  .results .cell {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 8px;
  }
  .results .cell .num {
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .results .cell .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-top: 4px;
  }
  .results .cell.wpm .num { color: var(--accent); }
  .results .cell.acc .num { color: var(--ok); }
  .results .cell.correct .num { color: var(--ok); }
  .results .cell.wrong .num { color: var(--err); }
  .results .restart-btn {
    border-color: var(--accent);
    color: var(--accent);
    padding: 10px 24px;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Type<span>Rush</span></h1>
      <button class="restart-btn" id="restartBtn" type="button">Restart</button>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="label">Time</div>
        <div class="value" id="timeDisplay">30.0</div>
      </div>
      <div class="stat">
        <div class="label">WPM</div>
        <div class="value accent" id="wpmDisplay">0</div>
      </div>
      <div class="stat">
        <div class="label">Accuracy</div>
        <div class="value ok" id="accDisplay">100%</div>
      </div>
    </div>

    <div class="text-viewport" id="textViewport">
      <div class="text-track" id="textTrack"></div>
    </div>
    <p class="hint" id="hint">Timer starts on your first keystroke. Type the text above.</p>

    <div class="results hidden" id="results">
      <h2>Time's up! Here are your results:</h2>
      <div class="grid">
        <div class="cell wpm"><div class="num" id="rWpm">0</div><div class="lbl">WPM</div></div>
        <div class="cell acc"><div class="num" id="rAcc">0%</div><div class="lbl">Accuracy</div></div>
        <div class="cell correct"><div class="num" id="rCorrect">0</div><div class="lbl">Correct</div></div>
        <div class="cell wrong"><div class="num" id="rWrong">0</div><div class="lbl">Wrong</div></div>
      </div>
      <button class="restart-btn" id="restartBtn2" type="button">Try Again</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var TEST_TEXT = "The quick brown fox jumps over the lazy dog while the farmer watches the sunset glow across the valley.";
  var DURATION = 30;
  var ANCHOR = 0.3; // current char sits at 30% from left edge of viewport

  var textViewport = document.getElementById("textViewport");
  var textTrack = document.getElementById("textTrack");
  var timeDisplay = document.getElementById("timeDisplay");
  var wpmDisplay = document.getElementById("wpmDisplay");
  var accDisplay = document.getElementById("accDisplay");
  var hint = document.getElementById("hint");
  var results = document.getElementById("results");
  var rWpm = document.getElementById("rWpm");
  var rAcc = document.getElementById("rAcc");
  var rCorrect = document.getElementById("rCorrect");
  var rWrong = document.getElementById("rWrong");

  var typed = "";
  var started = false;
  var finished = false;
  var startTime = 0;
  var rafId = null;
  var correctTotal = 0;
  var wrongTotal = 0;
  var charEls = []; // cache of span elements

  function render() {
    var html = "";
    var i;
    for (i = 0; i < TEST_TEXT.length; i++) {
      var ch = TEST_TEXT[i];
      var safe = ch === " " ? "&nbsp;" : ch.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      var cls = "char";
      if (i < typed.length) {
        cls += typed[i] === ch ? " correct" : " incorrect";
      } else if (i === typed.length && started && !finished) {
        cls += " current";
      }
      html += '<span class="' + cls + '">' + safe + "</span>";
    }
    textTrack.innerHTML = html;
    charEls = textTrack.querySelectorAll(".char");
    shiftTrack();
  }

  function shiftTrack() {
    var idx = started && !finished ? typed.length : 0;
    if (idx >= charEls.length) return;
    var el = charEls[idx];
    if (!el) return;
    var viewportW = textViewport.clientWidth;
    // el.offsetLeft is relative to textTrack (its offsetParent)
    var charLeft = el.offsetLeft;
    // We want: charLeft - translateX = viewportW * ANCHOR
    var tx = charLeft - viewportW * ANCHOR;
    // Clamp: don't scroll past start (tx <= 0 means text is at beginning)
    // and don't scroll past end
    var maxTx = textTrack.scrollWidth - viewportW;
    tx = Math.max(0, Math.min(tx, Math.max(0, maxTx)));
    textTrack.style.transform = "translateX(" + (-tx) + "px)";
  }

  function elapsed() {
    return (Date.now() - startTime) / 1000;
  }

  function computeWPM() {
    var t = elapsed();
    if (t <= 0) return 0;
    var minutes = t / 60;
    return Math.round(typed.length / 5 / minutes);
  }

  function computeAccuracy() {
    var total = correctTotal + wrongTotal;
    if (total === 0) return 100;
    return Math.round((correctTotal / total) * 1000) / 10;
  }

  function updateStats() {
    var t = elapsed();
    timeDisplay.textContent = Math.max(0, DURATION - t).toFixed(1);
    wpmDisplay.textContent = computeWPM();
    accDisplay.textContent = computeAccuracy().toFixed(1) + "%";
  }

  function tick() {
    if (!finished) {
      updateStats();
      if (elapsed() >= DURATION) {
        finish();
      } else {
        rafId = requestAnimationFrame(tick);
      }
    }
  }

  function finish() {
    finished = true;
    cancelAnimationFrame(rafId);
    var t = Math.min(elapsed(), DURATION);
    var minutes = t / 60;
    var wpm = minutes > 0 ? Math.round(typed.length / 5 / minutes) : 0;
    var acc = computeAccuracy();
    rWpm.textContent = wpm;
    rAcc.textContent = acc.toFixed(1) + "%";
    rCorrect.textContent = correctTotal;
    rWrong.textContent = wrongTotal;
    hint.classList.add("hidden");
    results.classList.remove("hidden");
  }

  function start() {
    started = true;
    startTime = Date.now();
    hint.textContent = "Go!";
    rafId = requestAnimationFrame(tick);
  }

  function onKey(e) {
    if (finished) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    if (e.key === "Backspace") {
      e.preventDefault();
      if (typed.length > 0) typed = typed.slice(0, -1);
      render();
      return;
    }
    if (e.key.length !== 1) return;
    if (typed.length >= TEST_TEXT.length) return;

    e.preventDefault();
    if (!started) start();

    var ch = e.key;
    if (ch === TEST_TEXT[typed.length]) correctTotal++;
    else wrongTotal++;
    typed += ch;
    updateStats();
    render();

    if (typed.length >= TEST_TEXT.length) finish();
  }

  function reset() {
    cancelAnimationFrame(rafId);
    typed = "";
    started = false;
    finished = false;
    startTime = 0;
    correctTotal = 0;
    wrongTotal = 0;
    timeDisplay.textContent = DURATION.toFixed(1);
    wpmDisplay.textContent = "0";
    accDisplay.textContent = "100.0%";
    hint.classList.remove("hidden");
    hint.textContent = "Timer starts on your first keystroke. Type the text above.";
    results.classList.add("hidden");
    render();
    textTrack.style.transform = "translateX(0)";
  }

  // Re-shift on window resize
  window.addEventListener("resize", function() {
    if (!finished) shiftTrack();
  });

  document.addEventListener("keydown", onKey);
  document.getElementById("restartBtn").addEventListener("click", reset);
  document.getElementById("restartBtn2").addEventListener("click", reset);
  reset();
})();
</script>
</body>
</html>
